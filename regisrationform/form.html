<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <h1><u>Registration Form</u></h1>
  <form action="" method="" target="" name="registration form">
    <label for="firstnaame">First Name:</label>
    <input type="text" id="firstname"
    maxlength="50" minlength="5" placeholder="Enter your name" required>
    <br>
    <br>
    <label for="lastname">Last Name:</label>
    <input type="text" id="lastname"
    maxlength="50" minlength="5" placeholder="Enter your last name" required>
    <br>
    <br>
    <label for="age">Age:</label>
    <input type="number" id="age"
    maxlength="116" minlength="16" placeholder="Enter your age" required>
    <br>
    <br>
    <label for="email">Email:  </label>
    <input type="email" id="email"
    maxlength="50" minlength="5" placeholder="Enter your email" required>
    <br>
    <br>
    <label for="phone">Phone:</label>
    <input type="tel" id="phone"  placeholder="Enter your phone number" required>
    <br>
    <br>
    <label for="gender">Gender:</label>
    <input type="radio" name="gender" value="male" required> Male
    <input type="radio" name="gender" value="female" required> Female
    <br>
    <br>
    <select name="stream" id="stream" required>
      <option value="">Select Stream</option>
      <option value="science">Science</option>
      <option value="commerce">Commerce</option>
      <option value="arts">Arts</option>
      </select>
      <br>
      <br>
      <label for ="password">Password:</label>
      <input type="password" id="password" placeholder="Enter your password" required>
      <br>
      <br>
      <label for="hobbies">Hobbies:</label>
      <textarea id="hobbies" placeholder="Enter your hobbies" required></textarea>
      <br>
      <br>
      <input type="submit" value="Submit">
      <input type="reset" value="Reset">
    
   
  </form>
  
</body>
</html>
